<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"></head>
<body style="margin:0;padding:0;background:#f4f4f4;font-family:sans-serif">
<div style="max-width:600px;margin:0 auto;background:#ffffff;padding:32px 24px;color:#1a1a2e">

  <p style="margin-top:0">Hi {{FIRST_NAME}},</p>

  <p>Your score has been received. Here's what we recorded:</p>

  <table style="margin:0 0 24px;border-collapse:collapse;width:100%">
    <tr>
      <td style="padding:12px 16px;background:#f8f8f8;border-radius:8px 8px 0 0;border-bottom:1px solid #e0e0e0">
        <span style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:#888">Score</span><br>
        <span style="font-size:20px;font-weight:700;color:#1a1a2e">{{YOUR_SCORE}} – {{OPP_SCORE}}</span>
      </td>
    </tr>
    <tr>
      <td style="padding:12px 16px;background:#f8f8f8;border-radius:0 0 8px 8px">
        <span style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:#888">Opponent</span><br>
        <span style="font-size:16px;font-weight:700;color:#db1230">{{OPPONENT_PSN}}</span>
      </td>
    </tr>
  </table>

  <p>Your score is locked in and can't be changed. We'll email you once the result is confirmed.</p>

  <hr style="border:none;border-top:1px solid #e0e0e0;margin:24px 0">

  <p style="margin-bottom:4px">See you on the pitch,</p>
  <p style="margin-top:0"><strong>The Couch Cup Team</strong><br>
  <a href="https://couchcup.co.za" style="color:#db1230">couchcup.co.za</a></p>

</div>
</body>
</html>
